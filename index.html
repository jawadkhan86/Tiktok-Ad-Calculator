  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script>
    function calculateTikTokIncome() {
      const views = parseInt(document.getElementById('tt-views').value);
      const niche = parseInt(document.getElementById('tt-niche').value);
      const engagement = parseInt(document.getElementById('tt-engagement').value);
      const location = parseInt(document.getElementById('tt-location').value);
      const length = parseInt(document.getElementById('tt-length').value);
      const season = parseInt(document.getElementById('tt-season').value);

      const rpmRanges = [
  [1.2, 2.0], [1.0, 1.8], [2.0, 3.0], [0.8, 1.5], [0.7, 1.2],
  [1.2, 2.0], [0.8, 1.3], [1.0, 1.6], [1.1, 1.8], [1.3, 2.2],
  [0.9, 1.4], [1.0, 1.7], [0.7, 1.2], [0.9, 1.4], [0.8, 1.3],
  [0.7, 1.1], [1.0, 1.6], [1.1, 1.7], [0.9, 1.5], [0.8, 1.4],
  [1.5, 2.4], [1.2, 2.0], [1.1, 1.9], [1.0, 1.6], [1.2, 1.9],
  [1.0, 1.6], [1.4, 2.3], [1.5, 2.5], [1.6, 2.4], [1.3, 2.0],
  [1.1, 1.8], [0.9, 1.5], [0.8, 1.4], [2.0, 3.0], [1.4, 2.3],
  [2.0, 3.0], [1.5, 2.2], [1.2, 2.0], [1.3, 2.1], [1.4, 2.2],
  [1.2, 2.0], [1.1, 1.9], [1.0, 1.6], [1.6, 2.4], [1.0, 1.5],
  [1.3, 2.1], [0.9, 1.4], [0.8, 1.4], [1.0, 1.7], [1.5, 2.3]
];
      const [minRPM, maxRPM] = rpmRanges[niche - 1];

      const engagementMultiplier = [1.3, 1.0, 0.7];
      const locationMultiplier = [1.4, 1.2, 1.0, 0.6, 0.7];
      const lengthMultiplier = [0.8, 1.2, 1.3];
      const seasonalityMultiplier = [1.3, 1.0, 0.8];

      const base = views / 1000;
      const multiplier =
        engagementMultiplier[engagement - 1] *
        locationMultiplier[location - 1] *
        lengthMultiplier[length - 1] *
        seasonalityMultiplier[season - 1];

      const minEarnings = base * minRPM * multiplier;
      const maxEarnings = base * maxRPM * multiplier;

      document.getElementById('result').innerText = `Estimated Creator Earnings: $${minEarnings.toFixed(2)} - $${maxEarnings.toFixed(2)}`;
      document.getElementById('result').style.display = 'block';
      document.getElementById('disclaimer').style.display = 'block';

      const ctx = document.getElementById('breakdownChart').getContext('2d');
      if (window.breakdownChart instanceof Chart) {
        window.breakdownChart.destroy();
      }

      window.breakdownChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['Engagement', 'Location', 'Video Length', 'Season'],
          datasets: [{
            data: [
              engagementMultiplier[engagement - 1],
              locationMultiplier[location - 1],
              lengthMultiplier[length - 1],
              seasonalityMultiplier[season - 1]
            ],
            backgroundColor: ['#36a2eb', '#ff6384', '#ffcd56', '#4bc0c0']
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            datalabels: {
              color: '#fff',
              formatter: (value, context) => {
                const total = context.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                const percent = ((value / total) * 100).toFixed(1);
                return `${context.chart.data.labels[context.dataIndex]}\n${percent}%`;
              }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const total = context.dataset.data.reduce((a, b) => a + b, 0);
                  const value = context.raw;
                  const percent = ((value / total) * 100).toFixed(1);
                  return `${context.label}: ${percent}%`;
                }
              }
            }
          }
        },
        plugins: [ChartDataLabels]
      });

      document.getElementById('breakdownChart').style.display = 'block';
      document.getElementById('chartTitle').style.display = 'block';
      document.getElementById('chartDesc').style.display = 'block';
    }
  </script>
